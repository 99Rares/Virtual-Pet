plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.rares.virtualpetpompi'
    compileSdk 37

    sourceSets {
        androidTest.assets.srcDirs += "$projectDir/schemas"   // migration tests read the exported Room schemas
    }

    defaultConfig {
        applicationId "com.rares.virtualpetpompi"
        minSdk 26
        targetSdk 37
        versionCode 3
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        // Required when editor project import realizes Compose preview tasks.
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
}

// Language-server model import visits preview tasks for both build variants.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enableUnitTest = true
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.icons.core
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.work.runtime.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.haze
    implementation libs.haze.blur

    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.turbine

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.kotlinx.coroutines.test
}
